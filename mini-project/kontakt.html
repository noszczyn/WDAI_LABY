<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moje Portfolio - Kontakt</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Kontakt</h1>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="galeria.html">Projekty</a></li>
                <li><a href="kontakt.html">Kontakt</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <form class="contact-form" action="#" method="POST">
                <label for="email">Twój adres e-mail:</label>
                <input type="email" id="email" name="email" required placeholder="name@example.com">

                <label for="subject">Temat wiadomości:</label>
                <select id="subject" name="subject" required>
                    <option value="">Wybierz temat</option>
                    <option value="wspolpraca">Propozycja współpracy</option>
                    <option value="zlecenie">Nowe zlecenie projektowe</option>
                    <option value="inne">Inne</option>
                </select>

                <label for="message">Treść wiadomości:</label>
                <textarea id="message" name="message" rows="6" required placeholder="Napisz tutaj swoją wiadomość..." minlength="10"></textarea>

                <button type="submit">Wyślij</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; Noszczyński Kacper.</p>
    </footer>
</body>
</html>
