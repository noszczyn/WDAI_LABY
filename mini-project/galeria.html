<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projekty i Galeria</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Portfolio</h1>
        <button class="theme-toggle" id="theme-toggle">🌙</button>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="galeria.html">Projekty</a></li>
                <li><a href="kontakt.html">Kontakt</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2 class="main-title">Dashboard Samochodowy </h2>
            <article class="project-stage">
                <h3 class="stage-title">Prototyp oraz komponenty</h3>

                <div class="gallery-grid">
                    <img src="assets/first_evaluations.jpg" alt="Prototypowy model do testowania oprogramowania">
                    <img src="assets/base.jpg" alt="Płyta główna Raspberry Pi stanowiąca serce układu">  
                </div>

                <div class="video-container">
                    <h3 class="stage-title">Prototyp podłączony do samochodu</h2>
                    <video width="640" height="360" controls>
                        <source src="assets/prototype.mp4" type="video/mp4">
                    </video>
                </div>
            </article>
            <article class="project-stage">
                <h3 class="stage-title">Finalny produkt</h3>
                <div class="final-product-container">
                    <img src="assets/final_product.jpg" alt="Finalny produkt zlozony w calosc">
                </div> 
            </article>
        </section>
    </main>

    <footer>
        <p>&copy; Noszczyński Kacper</p>
    </footer>
    <script src="index.js"></script>
</body>
</html>
